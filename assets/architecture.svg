<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">RecallOps Google Cloud architecture</title>
  <desc id="desc">Synthetic enterprise events travel through Pub/Sub to a Recall Coordinator using Google ADK and Gemini. The coordinator discovers private Supply and Finance agents through Agent Registry and A2A. Typed policy tools mutate Firestore while Cloud Trace and the public dashboard expose governed evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset="1" stop-color="#0d2440"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6ef3"/>
      <stop offset="1" stop-color="#0b4eba"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b9b65"/>
      <stop offset="1" stop-color="#087448"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d99118"/>
      <stop offset="1" stop-color="#a65f00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020811" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#80a7cf"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f5f9ff; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a9c1da; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d8e7f5; }
      .eyebrow { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #88bfff; }
      .line { fill: none; stroke: #80a7cf; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #d9a64b; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" rx="28" fill="url(#background)"/>
  <text x="60" y="68" class="title">RecallOps · governed Taskmaster workflow on Google Cloud</text>
  <text x="60" y="99" class="subtitle">Gemini coordinates · typed tools control · every action persists with identity, idempotency, and trace evidence</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="225" height="154" rx="18" fill="#142b45" stroke="#315778"/>
    <text x="84" y="200" class="eyebrow">SYNTHETIC SOURCES</text>
    <text x="84" y="237" class="label">Enterprise events</text>
    <text x="84" y="267" class="small">Warehouse transfer</text>
    <text x="84" y="291" class="small">Safety recall feed</text>
    <text x="84" y="315" class="small">Late stock + retry</text>

    <rect x="355" y="187" width="190" height="120" rx="18" fill="#203a57" stroke="#46729b"/>
    <text x="379" y="221" class="eyebrow">EVENT BUS</text>
    <text x="379" y="258" class="label">Pub/Sub</text>
    <text x="379" y="284" class="small">OIDC push · one topic</text>

    <rect x="625" y="150" width="330" height="192" rx="22" fill="url(#blue)" stroke="#69a6ff"/>
    <text x="653" y="185" class="eyebrow" fill="#dbeaff">PRODUCT SAFETY</text>
    <text x="653" y="224" class="label">Recall Coordinator</text>
    <text x="653" y="253" class="small">Google ADK + Gemini 3.5 Flash-Lite</text>
    <rect x="653" y="278" width="274" height="39" rx="10" fill="#07377e" opacity="0.9"/>
    <text x="670" y="303" class="small">Interpret → select typed containment tool</text>

    <rect x="1040" y="187" width="290" height="120" rx="18" fill="#382d1c" stroke="#b77c21"/>
    <text x="1066" y="221" class="eyebrow" fill="#ffd88b">DISCOVERY</text>
    <text x="1066" y="258" class="label">Agent Registry</text>
    <text x="1066" y="284" class="small">Approved A2A Agent Cards</text>
  </g>

  <path class="line" d="M285 247 H355"/>
  <path class="line" d="M545 247 H625"/>
  <path class="dash" d="M955 215 H1040"/>

  <g filter="url(#shadow)">
    <rect x="350" y="440" width="310" height="166" rx="20" fill="url(#green)" stroke="#6dd2a4"/>
    <text x="378" y="475" class="eyebrow" fill="#d9ffed">PROCUREMENT</text>
    <text x="378" y="513" class="label">Supply Continuity Agent</text>
    <text x="378" y="541" class="small">Private Cloud Run · ADK specialist</text>
    <text x="378" y="573" class="small">Certification → shortage → bounded PO</text>

    <rect x="740" y="440" width="310" height="166" rx="20" fill="url(#amber)" stroke="#ffd177"/>
    <text x="768" y="475" class="eyebrow" fill="#fff0c9">FINANCE / ADMIN</text>
    <text x="768" y="513" class="label">Financial Recovery Agent</text>
    <text x="768" y="541" class="small">Private Cloud Run · ADK specialist</text>
    <text x="768" y="573" class="small">Loss → invoice hold → bounded claim</text>

    <rect x="1105" y="424" width="225" height="198" rx="20" fill="#172d46" stroke="#416888"/>
    <text x="1131" y="459" class="eyebrow">A2A HANDOFFS</text>
    <text x="1131" y="496" class="label">Private JSON-RPC</text>
    <text x="1131" y="527" class="small">IAM-authenticated</text>
    <text x="1131" y="551" class="small">Registry-resolved</text>
    <text x="1131" y="575" class="small">Identity-attributed</text>
    <text x="1131" y="599" class="small">Human-readable audit</text>
  </g>

  <path class="line" d="M760 342 C705 385 600 392 525 440"/>
  <path class="line" d="M820 342 C855 382 885 400 895 440"/>
  <path class="dash" d="M1040 275 C1095 327 1145 363 1180 424"/>

  <g filter="url(#shadow)">
    <rect x="110" y="690" width="460" height="112" rx="18" fill="#18324d" stroke="#4e789d"/>
    <text x="138" y="724" class="eyebrow">DETERMINISTIC AUTHORITY</text>
    <text x="138" y="759" class="label">Typed policy tools</text>
    <text x="138" y="785" class="small">Permissions · approvals · identity · idempotency · mutations</text>

    <rect x="650" y="690" width="260" height="112" rx="18" fill="#18324d" stroke="#4e789d"/>
    <text x="678" y="724" class="eyebrow">PERSISTENT STATE</text>
    <text x="678" y="759" class="label">Firestore</text>
    <text x="678" y="785" class="small">Business + audit ledgers</text>

    <rect x="990" y="690" width="300" height="112" rx="18" fill="#18324d" stroke="#4e789d"/>
    <text x="1018" y="724" class="eyebrow">VISIBLE EVIDENCE</text>
    <text x="1018" y="759" class="label">Dashboard + Cloud Trace</text>
    <text x="1018" y="785" class="small">Actions · state · agent identities</text>
  </g>

  <path class="line" d="M505 606 C480 640 405 650 360 690"/>
  <path class="line" d="M895 606 C855 651 660 648 550 690"/>
  <path class="line" d="M570 746 H650"/>
  <path class="line" d="M910 746 H990"/>

  <text x="60" y="838" class="subtitle">One image · three Cloud Run services · min instances 0 / max 1 · four-call workflow budget · synthetic data only</text>
</svg>
